<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f4f6fb">
  <title>سمعلي</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="stage">
    <section class="hint" id="hint" aria-live="polite" hidden>
      <p class="hint-line" id="hint-line"></p>
      <p class="hint-q" id="hint-q" hidden></p>
      <img id="hint-img" alt="">
      <p class="hint-words" id="hint-words" hidden></p>
    </section>
    <p class="cheer" id="cheer" aria-live="polite" hidden></p>
    <p class="notice" id="notice" hidden></p>
    <span class="dot" id="dot" aria-hidden="true"></span>
  </main>

  <script src="vendor/capacitor.js"></script>
  <script src="native-shim.js"></script>
  <script src="match.js"></script>
  <script src="speech.js"></script>
  <script src="app.js"></script>
</body>
</html>
